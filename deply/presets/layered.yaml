deply:
  paths:
    - "."

  exclude_files:
    - '(^|/)\.venv/'
    - '(^|/)tests?/'
    - '(^|/)migrations/'

  layers:
    - name: presentation
      collectors:
        - type: directory
          directories:
            - "src/app/presentation"

    - name: application
      collectors:
        - type: directory
          directories:
            - "src/app/application"

    - name: domain
      collectors:
        - type: directory
          directories:
            - "src/app/domain"

    - name: infrastructure
      collectors:
        - type: directory
          directories:
            - "src/app/infrastructure"

  ruleset:
    domain:
      disallow_layer_dependencies:
        - presentation
        - application
        - infrastructure
      disallow_external_imports:
        - django
        - fastapi
        - flask
        - sqlalchemy
        - requests

    application:
      disallow_layer_dependencies:
        - presentation
        - infrastructure

    infrastructure:
      disallow_layer_dependencies:
        - presentation
